[workspace]
members = [
    "crates/nexray-core",
    "crates/nexray-cli",
    "crates/xray-stub",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Proprietary"
authors = ["Nexray Authors"]

[workspace.dependencies]
# Pure-Rust core (parser, types, schema mirror).
nexray-core = { path = "crates/nexray-core" }

# Shared third-party deps. Pinned major versions; minor bumps in workspace.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.10"
url = "2.5"
base64 = "0.22"
regex = "1.10"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

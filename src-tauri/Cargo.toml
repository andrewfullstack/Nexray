[package]
name = "nexray"
description = "Minimal modern VLESS client (cdn-ws + reality only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "nexray"
path = "src/lib.rs"

[[bin]]
name = "nexray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
nexray-core = { workspace = true }
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
url = { workspace = true }

# System-proxy backend deps. macOS and Linux shell out to `networksetup` /
# `gsettings`, which need no crates. Windows needs registry access plus the
# WinINet `InternetSetOptionW` call to push changes to already-running clients.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
] }

[lints]
workspace = true

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nexray app icon — 1024×1024.
  Mirrors the in-app brand mark: gradient squircle (sky-blue → indigo)
  + a glassy lightning bolt. Same accent gradient (#4f8aff → #7c5dff)
  used on the primary button and the active-server indicator, so the
  icon, the dock badge, and the in-app chrome read as one identity.

  The Zap glyph traces an "N"-ish zig-zag at the right proportions —
  reads as both "fast" (lightning) and a stylised first letter. Deliberately
  no shield/lock — those say "security app" generically; the lightning
  bolt against the gradient says "fast proxy" specifically.

  Generate platform sizes with:  pnpm tauri icon src-tauri/icons/icon.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Same gradient as the in-app brand-mark. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8aff"/>
      <stop offset="100%" stop-color="#7c5dff"/>
    </linearGradient>
    <!-- Soft top-left highlight that gives the icon a glassy feel.
         Without this it reads as flat brand color. -->
    <radialGradient id="highlight" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner drop-shadow at the bottom for depth. -->
    <linearGradient id="bottomshade" x1="0" y1="700" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- The bolt's "energy" glow — sits under the white bolt. -->
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>
    <!-- Subtle drop shadow under the bolt for tactility. -->
    <filter id="bolt-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Squircle clipPath so highlights don't bleed past the rounded corners. -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- 1. Squircle background with the brand gradient. -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- 2. Glass highlight (soft white wash, top-left) — clipped to the
       squircle so the radial doesn't leak past the corners. -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#highlight)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bottomshade)"/>
  </g>

  <!-- 3. The bolt's energy glow (a fuzzy whiteish copy underneath). -->
  <path
    d="M540,232 L260,568 L512,568 L484,792 L764,456 L512,456 Z"
    fill="#ffffff"
    fill-opacity="0.45"
    filter="url(#bolt-glow)"
  />

  <!-- 4. Main bolt — clean white, drop-shadowed for tactility. -->
  <path
    d="M540,232 L260,568 L512,568 L484,792 L764,456 L512,456 Z"
    fill="#ffffff"
    filter="url(#bolt-shadow)"
  />

  <!-- 5. Tiny inner highlight stripe along the bolt's leading edge —
       sells the "glassy" feel at large sizes. -->
  <path
    d="M540,232 L518,288 L298,556 L487,556 L460,752 L483,792 L512,568 L260,568 Z"
    fill="#ffffff"
    fill-opacity="0.18"
  />

  <!-- 6. Hairline outer ring for a clean edge against light desktops. -->
  <rect
    x="0.5" y="0.5" width="1023" height="1023" rx="229.5" ry="229.5"
    fill="none"
    stroke="#000000" stroke-opacity="0.12" stroke-width="1"
  />
</svg>

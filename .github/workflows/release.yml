name: Release

# Tag-driven release. Tag a commit `v*.*.*` here in the source repo and
# this workflow:
#   1. Builds installers for all four platforms in parallel.
#   2. Uploads each as a workflow artifact (not a release in THIS repo).
#   3. Final `publish` job downloads all four and creates a draft
#      release on the public sibling repo `andrewfullstack/Nexray-App`,
#      with every installer attached.
#
# Why split source vs. release repo:
#   - This repo holds the dev history; Nexray-App stays clean — just
#     binaries, README, and (eventually) a GitHub Pages download site.
#   - End-users only see Nexray-App; they never browse the source.
#
# ─── Required secret for cross-repo publish ─────────────────────────
#
#   RELEASE_PUBLISH_TOKEN
#     Fine-grained Personal Access Token issued by the user that owns
#     andrewfullstack/Nexray-App. Settings → Developer settings →
#     Personal access tokens → Fine-grained → New.
#       Resource owner:    andrewfullstack
#       Repository access: only `Nexray-App`
#       Permissions:       Contents = Read and write
#                          Metadata  = Read (auto)
#     Paste the token into THIS repo's
#       Settings → Secrets and variables → Actions → New repository secret
#     under the name `RELEASE_PUBLISH_TOKEN`.
#
# ─── Optional signing secrets (build job, same as before) ──────────
#
# macOS code-signing + notarisation:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#
# Windows code-signing:
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#
# Auto-updater signing (only if `tauri.conf.json → updater.active = true`):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Missing signing secrets are tolerated — `tauri-action` skips the
# matching step. Only RELEASE_PUBLISH_TOKEN is hard-required.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# This workflow only READS this repo's contents (the publish step writes
# to a different repo, using the PAT below — not the workflow's default
# GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Trimmed matrix: one installer per platform.
        #   macOS  → .dmg only (Apple Silicon; Intel dropped)
        #   Linux  → .deb only (AppImage / RPM dropped)
        #   Windows → NSIS .exe only (MSI dropped)
        # `bundles` is forwarded to `tauri build --bundles <type>` so
        # tauri-action emits exactly one installer per matrix slot.
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version is read from package.json's `packageManager` field —
        # don't pin here too or pnpm/action-setup@v4 errors with
        # ERR_PNPM_BAD_PM_VERSION ("multiple versions specified").
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      # Stamp the tag's version into package.json, tauri.conf.json, and
      # the workspace Cargo.toml so the bundler emits correctly-versioned
      # filenames (`Nexray_1.2.3_aarch64.dmg`) without anyone having to
      # bump source first. Tag-only — workflow_dispatch from a branch
      # leaves the source-tree value alone (typically "0.0.0" for dev).
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/stamp-version.mjs ${{ github.ref_name }}

      - run: pnpm install --frozen-lockfile

      - name: Fetch xray-core + tun2socks + geo data
        # pnpm v9 passes everything after the script name as positional
        # args to the script — no `--` separator needed (and including
        # one passes a literal `--` argv that fetch-core.mjs rejects as
        # an unknown flag).
        run: pnpm run fetch-core --target=${{ matrix.target }}
        env:
          NEXRAY_RELEASE_FETCH: "1"

      # Build-only mode: NO `tagName` argument, so `tauri-action` skips
      # its own release-creation step and just produces installer
      # bundles in `target/<triple>/release/bundle/` (workspace target,
      # at the repo root — NOT under src-tauri/). The cross-repo
      # publish job below picks them up via workflow artifacts.
      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Tauri auto-updater signing — used only when
          # tauri.conf.json → plugins.updater.active = true. Currently
          # false; key absent is fine.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code-signing env vars (APPLE_*, WINDOWS_*) deliberately NOT
          # forwarded for the initial release — `tauri-action` attempts
          # `security import` whenever APPLE_CERTIFICATE is non-empty,
          # and a malformed-but-non-empty secret kills the macOS bundle
          # step. Re-add these env entries when you have working signing
          # certs. Until then artefacts ship unsigned (Gatekeeper
          # right-click-Open / SmartScreen warning on first launch).
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Hand the installers off to the publish job. Each matrix slot
      # uploads under its own artifact name so we don't clobber.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./release-staging
          # Cargo's workspace `target/` lives at the repo root (the
          # workspace members live in src-tauri/, crates/*, but the
          # build artefacts go to <root>/target/). The path is NOT
          # under src-tauri/ — earlier wiring assumed it was and the
          # collect step always failed with "expected bundle dir not
          # found".
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::expected bundle dir not found: $BUNDLE_DIR"
            ls -la target/${{ matrix.target }}/release 2>&1 || true
            exit 1
          fi
          # One installer per platform: .dmg (macOS arm64), .deb (Linux
          # x86_64), .exe (Windows NSIS x86_64). The `.sig` siblings
          # are only emitted when the tauri-updater signing key is
          # configured — left in the glob so they ride along when
          # present, ignored otherwise.
          find "$BUNDLE_DIR" -type f \( \
              -name "*.dmg" -o \
              -name "*.deb" -o \
              -name "*.exe" -o \
              -name "*.nsis.zip" -o \
              -name "*.nsis.zip.sig" \
            \) -exec cp -v {} ./release-staging/ \;
          echo "--- staged ---"
          ls -la ./release-staging

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: ./release-staging
          if-no-files-found: error
          retention-days: 7

  publish:
    # NOTE: GitHub Actions' `env` context is NOT available in
    # `jobs.<id>.name` — the parser rejects the workflow with a 0s
    # failure if you try. The publish-target repo is therefore
    # hard-coded as a literal everywhere it's referenced.
    name: Publish to andrewfullstack/Nexray-App
    needs: build
    runs-on: ubuntu-22.04
    # Only tag-driven runs become real releases. workflow_dispatch from
    # a branch builds artifacts (useful for smoke-testing the pipeline)
    # but skips publishing — there's no SemVer tag to attach the release to.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # Only need the working tree for the changelog excerpt below.
          # No credentials helper is set, so any subsequent gh-cli call
          # uses RELEASE_PUBLISH_TOKEN (set as `GH_TOKEN` env), which
          # targets the publish repo, not this one.
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded
          # Match the names from the build job's upload step.
          pattern: installers-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./downloaded

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          {
            echo "Nexray ${{ github.ref_name }} — built from ${{ github.repository }}@${{ github.sha }}."
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | File |"
            echo "|----------|--------------|------|"
            for f in ./downloaded/*; do
              base="$(basename "$f")"
              case "$base" in
                *aarch64*.dmg)      echo "| macOS (Apple Silicon) | aarch64 | \`$base\` |" ;;
                *amd64.deb)         echo "| Linux                 | x86_64  | \`$base\` |" ;;
                *_x64-setup.exe)    echo "| Windows               | x86_64  | \`$base\` |" ;;
                *) ;;
              esac
            done
            echo
            echo "Source for this release: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}>."
          } > ./release-notes.md
          cat ./release-notes.md

      - name: Create or refresh release on andrewfullstack/Nexray-App
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_PUBLISH_TOKEN secret is not configured. See workflow header for setup."
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          REPO="andrewfullstack/Nexray-App"
          # Idempotent publish: if a release for this tag already exists
          # on the public repo (e.g. a cancelled previous run uploaded
          # binary-less stubs, or this is a re-run after a fix),
          # overwrite its assets in place with the freshly-built ones.
          # Otherwise create the release fresh as a draft. Either way,
          # the artefacts on disk after this step are authoritative.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists on $REPO — clobbering assets in place"
            gh release upload "$TAG" --repo "$REPO" --clobber ./downloaded/*
            # `gh release edit` can fail with HTTP 422 "Release.target_commitish is invalid"
            # when the pre-existing release was anchored to a commit that's
            # since been orphaned (e.g. force-pushed branch on the public repo,
            # legacy artefacts from before this CI was rebuilt). Fall back to
            # a `gh api` PATCH that ONLY touches `body` so target_commitish is
            # left alone. As a last resort just warn — the assets are what
            # actually matter for end users.
            if ! gh release edit "$TAG" --repo "$REPO" --notes-file ./release-notes.md 2>/dev/null; then
              RELEASE_ID=$(gh release view "$TAG" --repo "$REPO" --json id --jq .id)
              if ! gh api -X PATCH "/repos/$REPO/releases/$RELEASE_ID" \
                    -f body="$(cat ./release-notes.md)" >/dev/null; then
                echo "::warning::release notes refresh failed for $TAG — assets were uploaded successfully, only the description text is stale"
              fi
            fi
          else
            echo "creating fresh draft release $TAG on $REPO"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Nexray $TAG" \
              --notes-file ./release-notes.md \
              --draft \
              ./downloaded/*
          fi

      # ─── Publish site contents to Nexray-App ─────────────────────
      # The `.publish_site/` folder in THIS repo is the canonical source
      # of everything that ends up in the public-facing Nexray-App repo:
      #
      #   .publish_site/README.md            → Nexray-App `main` branch
      #   .publish_site/index.template.html  → Nexray-App `gh-pages`
      #                                         branch (after envsubst
      #                                         with this release's
      #                                         filenames + version)
      #
      # Both are force-pushed; each release authoritatively replaces the
      # prior content, so editing this folder in the source repo is the
      # only supported way to change the public README or Pages site.
      #
      # One-time setup on Nexray-App:
      #   Settings → Pages → Source: Deploy from a branch
      #     → Branch: `gh-pages` / Folder: `(root)` → Save.

      - name: Resolve installer filenames
        id: filenames
        shell: bash
        run: |
          set -euo pipefail
          pick() {
            # Picks the first match for a glob pattern from ./downloaded
            # and emits its basename. Empty string if no match — we
            # tolerate that so a partial release still produces a
            # page (with the corresponding card showing an empty link).
            local match
            match=$(find ./downloaded -maxdepth 1 -type f -name "$1" | sort | head -1 || true)
            if [ -n "$match" ]; then basename "$match"; else echo ""; fi
          }
          {
            echo "dmg_arm=$(pick 'Nexray_*_aarch64.dmg')"
            echo "deb=$(pick 'nexray_*_amd64.deb')"
            echo "exe=$(pick 'Nexray_*_x64-setup.exe')"
          } >> "$GITHUB_OUTPUT"

      - name: Render Pages site
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          PUBLISH_REPO: andrewfullstack/Nexray-App
          BASE: https://github.com/andrewfullstack/Nexray-App/releases/download/${{ github.ref_name }}
          DMG_ARM: ${{ steps.filenames.outputs.dmg_arm }}
          DEB: ${{ steps.filenames.outputs.deb }}
          EXE: ${{ steps.filenames.outputs.exe }}
        run: |
          set -euo pipefail
          mkdir -p ./pages
          # Whitelisted-variable substitution: only the names listed
          # below are interpolated; any other `$` in the template is
          # left intact.
          envsubst '${VERSION} ${PUBLISH_REPO} ${BASE} ${DMG_ARM} ${DEB} ${EXE}' \
            < .publish_site/index.template.html \
            > ./pages/index.html
          # Pages serves any folder Jekyll-style by default; .nojekyll
          # disables that so the HTML is served verbatim (no risk of
          # `_*` filenames being hidden, no Liquid interpolation).
          touch ./pages/.nojekyll
          echo "--- rendered ---"
          ls -la ./pages
          head -20 ./pages/index.html

      - name: Deploy site to gh-pages of andrewfullstack/Nexray-App
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_PUBLISH_TOKEN missing — Pages deploy needs the same token."
            exit 1
          fi
          # Single-commit history on the gh-pages branch — each release
          # is the new state, no log to keep. Force-push is intentional
          # and safe: Pages doesn't care about history, only the
          # working tree of the branch tip.
          cd ./pages
          git init -q -b gh-pages
          git config user.name  "andrewfullstack"
          git config user.email "278670969+andrewfullstack@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.ref_name }} (build ${{ github.sha }})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/andrewfullstack/Nexray-App.git"
          git push --force --quiet origin gh-pages
          echo "::notice title=Pages deployed::https://${OWNER:-andrewfullstack}.github.io/$(basename andrewfullstack/Nexray-App)/ — enable in Nexray-App → Settings → Pages → Source: gh-pages branch"

      - name: Sync README.md to main of andrewfullstack/Nexray-App
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_PUBLISH_TOKEN missing — README sync needs the same token."
            exit 1
          fi
          # Same single-commit-force-push pattern as gh-pages: main on
          # the public repo holds nothing but the README, replaced
          # wholesale on every release. The only authoritative copy of
          # the public README lives in `.publish_site/README.md` in the
          # source repo.
          mkdir -p ./public-main
          cp .publish_site/README.md ./public-main/README.md
          cd ./public-main
          git init -q -b main
          git config user.name  "andrewfullstack"
          git config user.email "278670969+andrewfullstack@users.noreply.github.com"
          git add README.md
          git commit -q -m "Sync README from Nexray@${{ github.sha }} (${{ github.ref_name }})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/andrewfullstack/Nexray-App.git"
          git push --force --quiet origin main
          echo "::notice title=README synced::andrewfullstack/Nexray-App/main updated from .publish_site/README.md"
